name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build, unit tests, integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Waypoint.sln

      # `dotnet list package --vulnerable` never sets a non-zero exit code even when it finds
      # something (confirmed empirically — a real gotcha, not an assumption) — grep the output
      # ourselves and fail explicitly, or this step would silently pass forever regardless of
      # what it finds. See docs/PRODUCTION_READINESS_AUDIT.md's CI/CD section: this is new, not
      # previously checked anywhere in CI.
      - name: Check for vulnerable NuGet packages
        run: |
          dotnet list Waypoint.sln package --vulnerable --include-transitive | tee /tmp/nuget-vuln.txt
          if grep -q "has the following vulnerable packages" /tmp/nuget-vuln.txt; then
            echo "::error::Vulnerable NuGet package(s) found — see output above."
            exit 1
          fi

      - name: Build
        run: dotnet build Waypoint.sln --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test Waypoint.sln --no-build --configuration Release --filter "FullyQualifiedName!~IntegrationTests"

      # GitHub-hosted ubuntu-latest runners have Docker pre-installed, so
      # WaypointApiFactory's Testcontainers path runs here even though it can't in a
      # sandbox without Docker (see tests/Waypoint.Api.IntegrationTests/WaypointApiFactory.cs
      # for the local-Postgres fallback used in that case).
      - name: Run integration tests
        run: dotnet test tests/Waypoint.Api.IntegrationTests --no-build --configuration Release

      # WaypointApiFactory writes its own connection diagnostics here (see that file) because
      # xUnit's console capture around a class fixture's IAsyncLifetime methods has proven
      # unreliable at surfacing Console output in this same job's own log — print the file
      # directly instead of trusting it showed up above. Runs even on failure.
      - name: Print WaypointApiFactory diagnostics
        if: always()
        run: cat /tmp/waypoint-integration-test-factory-diagnostics.log 2>/dev/null || echo "(no diagnostics file was written)"

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Unlike dotnet's vulnerable-package check, npm audit already exits non-zero (moderate
      # severity or higher, by default) when it finds something — no extra grep needed here. See
      # docs/PRODUCTION_READINESS_AUDIT.md's CI/CD section: this is new, not previously checked.
      - name: Check for vulnerable npm packages
        run: npm audit --omit=dev

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # Split into two independent jobs rather than one job building both images sequentially.
  # The combined job intermittently failed on "Build web image" with a bare "exit code 1" and no
  # further detail in the logs GitHub's UI/API expose without repo-admin rights (confirmed: the
  # job-logs download endpoint 403s "Must have admin rights to Repository" even for a public repo
  # — the same access limitation hit earlier building this CI workflow in the first place). Local
  # reproduction was inconclusive: both a native arm64 build and an emulated linux/amd64 build
  # (via Docker Desktop's QEMU backend) succeeded on retry, after one QEMU run hit an unrelated
  # "qemu: uncaught target signal 11" — a known artifact of running native Rust/V8 tooling
  # (Turbopack) under user-mode emulation, not evidence of a real bug. The API image build is
  # large (mcr.microsoft.com/dotnet/sdk base + the full solution) and ran immediately before the
  # web build in the same job/runner/disk — a plausible, untested explanation is resource pressure
  # (disk or memory) carried over from the first build starving the second, since GitHub-hosted
  # runners have finite local disk. Splitting removes that whole class of interference regardless
  # of whether it was the actual cause, and each job also dumps disk/image diagnostics so a real
  # failure next time leaves real evidence instead of a bare exit code.
  docker-api:
    name: Docker (build API image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Waypoint.Api/Dockerfile -t waypoint-api:ci .

      - name: Diagnostics
        if: always()
        run: |
          echo "--- disk ---"; df -h
          echo "--- images ---"; docker images

  docker-web:
    name: Docker (build web image)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t waypoint-web:ci apps/web

      - name: Diagnostics
        if: always()
        run: |
          echo "--- disk ---"; df -h
          echo "--- images ---"; docker images

  docker-compose-config:
    name: Docker (validate docker-compose.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
